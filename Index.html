
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PasarKita - Marketplace</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f5f9;
      color: #222;
    }

    header {
      background: #1769ff;
      color: white;
      padding: 20px 16px;
    }

    header h1 {
      margin: 0 0 12px;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 0;
      border-radius: 8px;
      font-size: 16px;
    }

    main {
      padding: 16px;
    }

    .produk {
      background: white;
      padding: 16px;
      border-radius: 12px;
      margin-bottom: 12px;
    }

    .harga {
      color: #1769ff;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <header>
    <h1>PasarKita</h1>
    <p>Belanja mudah, kapan saja!</p>
    <input type="search" placeholder="Cari produk...">
  </header>

  <main>
    <h2>Produk Pilihan</h2>

    <div class="produk">
      <h3>Headphone Gaming</h3>
      <p>Headphone untuk bermain game.</p>
      <p class="harga">Rp150.000</p>
    </div>

    <div class="produk">
      <h3>Mouse Gaming</h3>
      <p>Mouse untuk aktivitas gaming.</p>
      <p class="harga">Rp85.000</p>
    </div>

    <div class="produk">
      <h3>Keyboard Gaming</h3>
      <p>Keyboard untuk komputer.</p>
      <p class="harga">Rp200.000</p>
    </div>
  </main>
</body>
</html>
